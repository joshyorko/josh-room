name: RCC controller maintenance

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

concurrency:
  group: rcc-controller-maintenance
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Discover and verify RCC candidate
        run: python scripts/rcc_maintenance.py --apply --report artifacts/rcc-maintenance-report.json
      - name: Create reviewable update
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=(
            vscode-extension/runtime/controller-artifact-manifest.json
            vscode-extension/runtime/manifest.json
            templates/room/vscode-extension/runtime/controller-artifact-manifest.json
            templates/room/vscode-extension/runtime/manifest.json
            release-lock.json
            templates/room/vscode-extension/runtime/release-lock.json
          )
          if git diff --quiet -- "${files[@]}"; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git stash push -m 'verified RCC candidate' -- "${files[@]}"
          branch="maintenance/rcc-controller"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            git fetch origin "$branch"
            git switch --track -c "$branch" "origin/$branch"
            git rebase "origin/$GITHUB_REF_NAME"
          else
            git switch -c "$branch"
          fi
          git stash pop
          git add "${files[@]}"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: qualify RCC controller dependency update'
          git push --set-upstream origin "$branch"
          open_pr=$(gh pr list --state open --base "$GITHUB_REF_NAME" --head "$GITHUB_REPOSITORY_OWNER:$branch" --json number --jq '.[0].number // empty')
          if [[ -z "$open_pr" ]]; then
            cat > /tmp/rcc-maintenance-pr.md <<'EOF'
          Automated RCC controller maintenance candidate.

          Closes joshyorko/josh-room#121
          EOF
            gh pr create --base "$GITHUB_REF_NAME" --head "$branch" --title 'chore: qualify RCC controller dependency update' --body-file /tmp/rcc-maintenance-pr.md
          fi
      - name: Upload qualification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rcc-maintenance-report
          path: artifacts/rcc-maintenance-report.json
