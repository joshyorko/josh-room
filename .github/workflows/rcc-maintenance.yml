name: RCC controller maintenance

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

concurrency:
  group: rcc-controller-maintenance
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Discover and verify RCC candidate
        run: python scripts/rcc_maintenance.py --apply --report artifacts/rcc-maintenance-report.json
      - name: Upload qualification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rcc-maintenance-report
          path: artifacts/rcc-maintenance-report.json
      - name: Create reviewable update
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- vscode-extension/runtime/controller-artifact-manifest.json vscode-extension/runtime/manifest.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          branch="maintenance/rcc-controller-${GITHUB_SHA:0:12}"
          git switch -c "$branch"
          git add vscode-extension/runtime/controller-artifact-manifest.json vscode-extension/runtime/manifest.json
          git commit -m 'chore: qualify RCC controller dependency update'
          git push --set-upstream origin "$branch"
          gh pr create --base "$GITHUB_REF_NAME" --head "$branch" --title 'chore: qualify RCC controller dependency update' --body 'Automated RCC controller maintenance candidate.

Closes joshyorko/josh-room#121'
