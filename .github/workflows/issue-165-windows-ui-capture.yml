name: Issue 165 installed VS Code UI capture
on:
  push:
    branches: [fix/165-restore-delete-ux-20261028]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact source commit to qualify
        required: true
        type: string
permissions:
  contents: read
env:
  NODE_VERSION: "22.23.4"
concurrency:
  group: issue-165-installed-ui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  installed-ui:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Verify requested source
        shell: pwsh
        env:
          REQUESTED_SHA: ${{ inputs.source_sha }}
        run: |
          if ((git rev-parse HEAD) -ne $env:GITHUB_SHA) { throw 'Source identity mismatch' }
          if ($env:REQUESTED_SHA -and $env:REQUESTED_SHA -ne $env:GITHUB_SHA) { throw 'Requested source mismatch' }
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify patched Node 22 runtime
        shell: pwsh
        run: |
          $runtime = Join-Path $env:RUNNER_TEMP 'issue-165-ui'
          New-Item -ItemType Directory -Force -Path $runtime | Out-Null
          node scripts/verify_node_version.js --minimum $env:NODE_VERSION --source-sha $env:GITHUB_SHA --report (Join-Path $runtime 'node-runtime.json')
          if ($LASTEXITCODE -ne 0) { throw 'Patched Node verification failed' }
      - name: Install official VS Code and exact candidate VSIX in a disposable profile
        shell: pwsh
        run: |
          $ui = Join-Path $env:RUNNER_TEMP 'issue-165-ui'
          New-Item -ItemType Directory -Force -Path $ui | Out-Null
          $zip = Join-Path $ui 'vscode.zip'
          Invoke-WebRequest 'https://update.code.visualstudio.com/latest/win32-x64-archive/stable' -OutFile $zip
          $code = Join-Path $ui 'code'
          Expand-Archive $zip $code
          $vsix = Join-Path $ui 'candidate.vsix'
          Push-Location vscode-extension
          npm run package -- --out $vsix
          if ($LASTEXITCODE -ne 0) { throw 'Candidate packaging failed' }
          Pop-Location
          $profile = Join-Path $ui 'profile'
          $extensions = Join-Path $ui 'extensions'
          & (Join-Path $code 'bin/code.cmd') --user-data-dir $profile --extensions-dir $extensions --install-extension $vsix --force
          if ($LASTEXITCODE -ne 0) { throw 'VSIX installation failed' }
          $version = (& (Join-Path $code 'bin/code.cmd') --version | Select-Object -First 1)
          "ISSUE165_UI_ROOT=$ui" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "ISSUE165_CODE_ROOT=$code" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "ISSUE165_VSIX=$vsix" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "ISSUE165_VSCODE_VERSION=$version" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Qualify the unmodified installed VSIX separately
        shell: pwsh
        run: |
          $env:CAPTURE_UI_ROOT = $env:ISSUE165_UI_ROOT
          $env:CAPTURE_CODE_ROOT = $env:ISSUE165_CODE_ROOT
          $env:CAPTURE_VSIX = $env:ISSUE165_VSIX
          $env:CAPTURE_VSCODE_VERSION = $env:ISSUE165_VSCODE_VERSION
          node scripts/capture_windows_ui.js
          if ($LASTEXITCODE -ne 0) { throw 'Unmodified installed VSIX qualification failed' }
          Copy-Item (Join-Path $env:ISSUE165_UI_ROOT 'receipt.json') (Join-Path $env:ISSUE165_UI_ROOT 'pristine-installed-receipt.json')
      - name: Prepare explicitly synthetic presentation copy without changing the VSIX
        shell: pwsh
        run: |
          $fixture = Join-Path $env:ISSUE165_UI_ROOT 'fixture'
          node scripts/prepare_issue165_ui_fixture.js $env:ISSUE165_VSIX $fixture | Out-File (Join-Path $env:ISSUE165_UI_ROOT 'fixture-identity.json') -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic fixture preparation failed' }
          "ISSUE165_FIXTURE_ROOT=$fixture" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Verify genuine deletion controls, confirmation, cancellation and fixture reload
        run: node scripts/capture_issue165_windows_ui.js
      - name: Add measured bounding boxes after capture
        shell: pwsh
        run: |
          python -m pip install Pillow
          if ($LASTEXITCODE -ne 0) { throw 'Screenshot annotation dependency unavailable' }
          python scripts/annotate_issue165_ui_receipts.py --receipt (Join-Path $env:ISSUE165_UI_ROOT 'receipt.json')
          if ($LASTEXITCODE -ne 0) { throw 'Screenshot bounding-box validation failed' }
      - name: Retain bounded runner diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: issue-165-windows-ui-attempt-${{ github.sha }}
          path: |
            ${{ runner.temp }}/issue-165-ui/receipt.json
            ${{ runner.temp }}/issue-165-ui/pristine-installed-receipt.json
            ${{ runner.temp }}/issue-165-ui/node-runtime.json
            ${{ runner.temp }}/issue-165-ui/fixture-identity.json
            ${{ runner.temp }}/issue-165-ui/fixture/state.json
            ${{ runner.temp }}/issue-165-ui/*.png
          if-no-files-found: ignore
