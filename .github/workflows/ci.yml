name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact source commit to qualify on an automation-created PR branch
        required: true
        type: string

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22.23.4"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Verify requested automation CI source
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Verify patched Node 22 runtime
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify_node_version.js \
            --minimum "$NODE_VERSION" \
            --source-sha "$GITHUB_SHA" \
            --report "$RUNNER_TEMP/node-runtime.json"
      - uses: astral-sh/setup-uv@v10.0.1
      - name: Install age CLI
        run: sudo apt-get update && sudo apt-get install --yes age
      - run: uv sync --group dev
      - run: uv run ruff check src tests
      - run: uv run pytest -q
      - run: node --test vscode-extension/*.test.js scripts/verify_node_version.test.js
      - run: git diff --check

  windows-private-runtime:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Verify native Windows private paths and change timestamps
        env:
          PYTHONPATH: vscode-extension/runtime/controller
        run: python scripts/verify_private_runtime.py

  managed-runtime-consumer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Verify patched Node 22 runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/managed-runtime-evidence
          node scripts/verify_node_version.js \
            --minimum "$NODE_VERSION" \
            --source-sha "$GITHUB_SHA" \
            --report dist/managed-runtime-evidence/node-runtime.json
      - name: Consume the clean candidate VSIX through managed RCC
        run: node scripts/managed_runtime_acceptance.js
      - name: Upload managed-runtime evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: managed-runtime-evidence-${{ matrix.os }}
          path: dist/managed-runtime-evidence
          if-no-files-found: ignore

  release-candidate:
    name: release-candidate
    if: github.repository == 'joshyorko/josh-room' && github.ref == 'refs/heads/main'
    needs: [test, windows-private-runtime, managed-runtime-consumer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Verify patched Node 22 runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/release-candidate
          node scripts/verify_node_version.js \
            --minimum "$NODE_VERSION" \
            --source-sha "$GITHUB_SHA" \
            --report dist/release-candidate/node-runtime.json
      - name: Confirm this CI run is building the exact source version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          version=$(node -p "require('./vscode-extension/package.json').version")
          test "$(node -p "require('./templates/room/vscode-extension/package.json').version")" = "$version"
          test "$(jq -r .extension_version vscode-extension/runtime/manifest.json)" = "$version"
          test "$(jq -r .extension_version templates/room/vscode-extension/runtime/manifest.json)" = "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build versioned standalone VSIX
        working-directory: vscode-extension
        run: npm run package
      - name: Verify and receipt the exact source VSIX
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SOURCE_SHA: ${{ github.sha }}
          CI_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p dist/release-candidate
          candidate="vscode-extension/josh-room-$VERSION.vsix"
          test -f "$candidate"
          python scripts/verify_release_candidate.py \
            --candidate "$candidate" \
            --version "$VERSION" --source-sha "$SOURCE_SHA" \
            --ci-run-id "$CI_RUN_ID" \
            --report "dist/release-candidate/candidate.json"
          cp "$candidate" dist/release-candidate/
          cmp "$candidate" "dist/release-candidate/josh-room-$VERSION.vsix"
      - uses: actions/upload-artifact@v7
        with:
          name: release-candidate-${{ steps.version.outputs.version }}-${{ github.sha }}
          path: dist/release-candidate/
          if-no-files-found: error
          retention-days: 90
