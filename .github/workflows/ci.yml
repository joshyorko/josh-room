name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact source commit to qualify on an automation-created PR branch
        required: true
        type: string

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22.23.4"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Verify requested automation CI source
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Verify patched Node 22 runtime
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify_node_version.js \
            --minimum "$NODE_VERSION" \
            --source-sha "$GITHUB_SHA" \
            --report "$RUNNER_TEMP/node-runtime.json"
      - uses: astral-sh/setup-uv@v10.0.1
      - name: Install age CLI
        shell: bash
        run: |
          set -euo pipefail
          stage=$(mktemp -d "$RUNNER_TEMP/age.XXXXXX")
          trap 'rm -rf "$stage"' EXIT
          curl --fail --location --silent --show-error --retry 3 --connect-timeout 15 --max-time 120 \
            https://github.com/FiloSottile/age/releases/download/v1.2.1/age-v1.2.1-linux-amd64.tar.gz \
            --output "$stage/age.tar.gz"
          printf '%s  %s\n' 7df45a6cc87d4da11cc03a539a7470c15b1041ab2b396af088fe9990f7c79d50 "$stage/age.tar.gz" | sha256sum --check --status
          tar -xzf "$stage/age.tar.gz" -C "$stage" age/age age/age-keygen
          sudo install -m 0755 "$stage/age/age" "$stage/age/age-keygen" /usr/local/bin/
          test "$(age --version)" = v1.2.1
          test "$(age-keygen --version)" = v1.2.1
      - run: uv sync --group dev
      - name: Validate current release changelog section
        env:
          SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: uv run python scripts/request_release.py validate --root . --branch "$SOURCE_BRANCH"
      - run: uv run ruff check src tests
      - run: uv run pytest -q
      - run: node --test vscode-extension/*.test.js scripts/verify_node_version.test.js scripts/room_view_*.test.js scripts/installed_recovery_runtime.test.js
      - run: node --experimental-strip-types --test omp-extension/tests/*.test.mjs
      - run: git diff --check

  windows-private-runtime:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Verify native Windows private paths and change timestamps
        env:
          PYTHONPATH: vscode-extension/runtime/controller
        run: python scripts/verify_private_runtime.py
      - uses: astral-sh/setup-uv@v10.0.1
      - name: Verify Windows component selection and installed-prefix refusal
        run: uv run pytest -q tests/test_homebrew_prefix.py tests/test_homebrew_declared.py tests/test_component_selection.py tests/test_serve_job_windows.py

  windows-recovery:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv sync --group dev
      - name: Install checksum-pinned Windows Restic
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP "recovery-restic"
          $receipt = uv run python scripts/install_restic.py --manifest vscode-extension/runtime/restic-manifest.json --destination $destination --platform win32-x64
          if ($LASTEXITCODE -ne 0) { throw "Pinned Restic installation failed" }
          $pin = $receipt | ConvertFrom-Json
          "JOSH_ROOM_TEST_RESTIC=$($pin.executable)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $receipt | Set-Content (Join-Path $env:RUNNER_TEMP "recovery-restic.json")
      - name: Verify native pinned recovery and no-clobber boundaries
        shell: pwsh
        run: uv run pytest tests/test_recovery_windows.py tests/test_recovery_text.py tests/test_encryption_windows.py tests/test_encryption_handoff_input.py -q -s --junitxml="$env:RUNNER_TEMP/recovery-windows.xml"
      - name: Upload native recovery evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-recovery-evidence
          path: |
            ${{ runner.temp }}/recovery-restic.json
            ${{ runner.temp }}/recovery-windows.xml
          if-no-files-found: error

  windows-installed-recovery:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      JOSH_ROOM_ACCEPTANCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv sync --group dev
      - name: Qualify installed registered recovery with native Windows custody
        shell: pwsh
        run: |
          node scripts/verify_node_version.js --minimum $env:NODE_VERSION --source-sha $env:GITHUB_SHA --report (Join-Path $env:RUNNER_TEMP "windows-recovery-node.json")
          if ($LASTEXITCODE -ne 0) { throw "Patched Node runtime verification failed" }
          node --test scripts/installed_recovery_runtime.test.js
          if ($LASTEXITCODE -ne 0) { throw "Installed runtime adapter regression failed" }
          $python = uv run python -c "import sys; print(sys.executable)"
          if ($LASTEXITCODE -ne 0) { throw "Project Python unavailable" }
          $env:JOSH_ROOM_ACCEPTANCE_PYTHON = $python.Trim()
          $env:JOSH_ROOM_WINDOWS_RECOVERY_EVIDENCE = Join-Path $env:RUNNER_TEMP "windows-installed-recovery-evidence"
          node scripts/windows_handoff_probe.js
          if ($LASTEXITCODE -ne 0) { throw "Native pre-write ACL dependency failed before downloads" }
          node scripts/windows_recovery_installed.js
          if ($LASTEXITCODE -ne 0) { throw "Installed Windows qualification failed; inspect sanitized receipt" }
      - name: Upload sanitized installed recovery evidence only
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-installed-recovery-evidence
          path: ${{ runner.temp }}/windows-installed-recovery-evidence/*.json
          if-no-files-found: error

  windows-immutable-recovery-cb860f7:
    # Explicit unpublished qualification input, never a product/default runtime pin.
    # Owner applies this label before pushing the acceptance-only checkpoint.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'qualify-windows-rcc-cb860f7')
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    env:
      CANDIDATE_SUBJECT: cb860f7f9387aea1561ab1cefa2bc15cf6936325
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Verify patched Node 22 runtime
        shell: pwsh
        run: |
          node scripts/verify_node_version.js --minimum "$env:NODE_VERSION" --source-sha "$env:GITHUB_SHA" --report "$env:RUNNER_TEMP/windows-immutable-node-runtime.json"
          if ($LASTEXITCODE -ne 0) { throw 'Patched Node runtime verification failed.' }
      - name: Retrieve existing exact-subject inputs without solve or product rebuild
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'immutable-recovery-inputs'
          New-Item -ItemType Directory -Path $root | Out-Null
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }
          $inputs = @(
            @{ Id = '14773761702'; Name = 'controller'; Sha = '36b35a45eb8fc6fae2feae497bf3d95ae6d2e30a318ff72459c462f24a5116ba' },
            @{ Id = '14773811481'; Name = 'product'; Sha = '6d7ce30b898b0aaacd371f270506347bed0ef29c6ba48fc061a7d2dc038b62d8' }
          )
          foreach ($inputAsset in $inputs) {
            $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts/$($inputAsset.Id)"
            $metadata = Invoke-RestMethod -Uri $uri -Headers $headers -TimeoutSec 30
            if ($metadata.expired -or $metadata.workflow_run.head_sha -ne $env:CANDIDATE_SUBJECT) { throw 'Subject artifact expired or belongs to another source.' }
            $archive = Join-Path $root "$($inputAsset.Name).zip"
            Invoke-WebRequest -Uri "$uri/zip" -Headers $headers -OutFile $archive -TimeoutSec 120
            if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLower() -ne $inputAsset.Sha) { throw 'Subject artifact ZIP digest mismatch.' }
            Expand-Archive -LiteralPath $archive -DestinationPath (Join-Path $root $inputAsset.Name)
          }
          $pin = Get-Content (Join-Path $root 'controller/josh-room-controller-windows-amd64.json') | ConvertFrom-Json
          if ($pin.source -ne $env:CANDIDATE_SUBJECT -or $pin.artifact_digest -ne 'sha256:db8ddadffdc5e3653ebe1d1f39a0bdd3b6cc28dc5a3b5673b543073572022b2a' -or !$pin.verified_no_build) { throw 'Candidate RCCA subject receipt mismatch.' }
          $candidate = @{
            subject_sha = $env:CANDIDATE_SUBJECT
            vsix = (Join-Path $root 'product/win32-x64/candidate.vsix')
            vsix_sha256 = '50b02d20e39b379bde2e396f60884d1adfd92dd219daa9a2e37dacddfabde8b4'
            archive = (Join-Path $root 'controller/josh-room-controller-windows-amd64.rcca')
            archive_sha256 = '75f6c0a82e13c80d62ec0e9b54a4aa930b3907e67b52096cfed047eeba3770d8'
            artifact = $pin.artifact_digest
          }
          $candidatePath = Join-Path $root 'candidate.json'
          $candidate | ConvertTo-Json | Set-Content $candidatePath -Encoding utf8NoBOM
          "JOSH_ROOM_ACCEPTANCE_RCC_CANDIDATE=$candidatePath" >> $env:GITHUB_ENV
          "JOSH_ROOM_ACCEPTANCE_HEAD_SHA=${{ github.event.pull_request.head.sha }}" >> $env:GITHUB_ENV
          "JOSH_ROOM_WINDOWS_RECOVERY_EVIDENCE=$(Join-Path $env:RUNNER_TEMP 'immutable-recovery-evidence')" >> $env:GITHUB_ENV
      - name: Qualify installed native recovery through the immutable candidate
        shell: pwsh
        run: |
          Remove-Item Env:GH_TOKEN -ErrorAction SilentlyContinue
          node --test scripts/installed_recovery_runtime.test.js
          if ($LASTEXITCODE -ne 0) { throw 'Candidate adapter contract failed.' }
          node scripts/windows_recovery_installed.js
          if ($LASTEXITCODE -ne 0) { throw 'Immutable installed recovery failed; inspect sanitized receipt.' }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-immutable-recovery-cb860f7
          path: ${{ runner.temp }}/immutable-recovery-evidence/*.json
          if-no-files-found: error

  managed-runtime-consumer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Verify patched Node 22 runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/managed-runtime-evidence
          node scripts/verify_node_version.js \
            --minimum "$NODE_VERSION" \
            --source-sha "$GITHUB_SHA" \
            --report dist/managed-runtime-evidence/node-runtime.json
      - name: Consume the clean candidate VSIX through managed RCC
        run: node scripts/managed_runtime_acceptance.js
      - name: Upload managed-runtime evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: managed-runtime-evidence-${{ matrix.os }}
          path: dist/managed-runtime-evidence
          if-no-files-found: ignore

  release-candidate:
    name: release-candidate
    if: github.repository == 'joshyorko/josh-room' && github.ref == 'refs/heads/main'
    needs: [test, windows-private-runtime, managed-runtime-consumer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Verify patched Node 22 runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/release-candidate
          node scripts/verify_node_version.js \
            --minimum "$NODE_VERSION" \
            --source-sha "$GITHUB_SHA" \
            --report dist/release-candidate/node-runtime.json
      - name: Record the setup-node action runtime
        shell: bash
        env:
          ACTION_REF: v7
        run: |
          set -euo pipefail
          action_sha=$(git ls-remote https://github.com/actions/setup-node.git "refs/tags/${ACTION_REF}^{}" | awk 'NR == 1 {print $1}')
          if [[ -z "$action_sha" ]]; then
            action_sha=$(git ls-remote https://github.com/actions/setup-node.git "refs/tags/${ACTION_REF}" | awk 'NR == 1 {print $1}')
          fi
          [[ "$action_sha" =~ ^[0-9a-f]{40}$ ]]
          runtime_source="https://raw.githubusercontent.com/actions/setup-node/$action_sha/action.yml"
          action_file="$RUNNER_TEMP/setup-node-action.yml"
          curl --fail --location --proto '=https' --tlsv1.2 "$runtime_source" > "$action_file"
          declared_runtime=$(awk '
            /^runs:[[:space:]]*$/ { in_runs = 1; next }
            in_runs && /^[[:space:]]+using:/ {
              sub(/^[[:space:]]+using:[[:space:]]*/, "")
              print
              exit
            }
            in_runs && /^[^[:space:]]/ { exit }
          ' "$action_file")
          declared_runtime=$(printf '%s' "$declared_runtime" | tr -d '"' | tr -d "'")
          declared_runtime=${declared_runtime//[[:space:]]/}
          [[ "$declared_runtime" =~ ^node[0-9]+$ ]]
          mkdir -p dist/release-candidate
          jq -n \
            --arg action "actions/setup-node" \
            --arg ref "$ACTION_REF" \
            --arg commit_sha "$action_sha" \
            --arg declared_runtime "$declared_runtime" \
            --arg runtime_source "$runtime_source" \
            '{schema_version: 1, action: $action, ref: $ref, commit_sha: $commit_sha, declared_runtime: $declared_runtime, runtime_source: $runtime_source}' \
            > dist/release-candidate/actions-runtime.json
      - name: Confirm this CI run is building the exact source version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          version=$(node -p "require('./vscode-extension/package.json').version")
          test "$(node -p "require('./templates/room/vscode-extension/package.json').version")" = "$version"
          test "$(jq -r .extension_version vscode-extension/runtime/manifest.json)" = "$version"
          test "$(jq -r .extension_version templates/room/vscode-extension/runtime/manifest.json)" = "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build versioned standalone VSIX
        working-directory: vscode-extension
        run: npm run package
      - name: Verify and receipt the exact source VSIX
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SOURCE_SHA: ${{ github.sha }}
          CI_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p dist/release-candidate
          candidate="vscode-extension/josh-room-$VERSION.vsix"
          test -f "$candidate"
          python scripts/verify_release_candidate.py \
            --candidate "$candidate" \
            --version "$VERSION" --source-sha "$SOURCE_SHA" \
            --ci-run-id "$CI_RUN_ID" \
            --report "dist/release-candidate/candidate.json"
          cp "$candidate" dist/release-candidate/
          cmp "$candidate" "dist/release-candidate/josh-room-$VERSION.vsix"
      - uses: actions/upload-artifact@v7
        with:
          name: release-candidate-${{ steps.version.outputs.version }}-${{ github.sha }}
          path: dist/release-candidate/
          if-no-files-found: error
          retention-days: 90
