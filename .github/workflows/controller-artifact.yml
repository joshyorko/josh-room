name: Build Josh Room controller artifact

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Native controller artifact platform
        required: true
        type: choice
        options:
          - linux-x64
          - win32-x64
        default: linux-x64

permissions:
  contents: read

jobs:
  linux-amd64:
    if: inputs.platform == 'linux-x64'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Download and verify the manifest-pinned RCC executable
        shell: bash
        run: |
          set -euo pipefail
          version=$(jq -er '.rcc.version' vscode-extension/runtime/controller-artifact-manifest.json)
          url=$(jq -er '.rcc.platforms["linux-x64"].url' vscode-extension/runtime/controller-artifact-manifest.json)
          sha=$(jq -er '.rcc.platforms["linux-x64"].sha256' vscode-extension/runtime/controller-artifact-manifest.json)
          [[ "$version" =~ ^v18\.19\.[0-9]+$ ]]
          [[ "$url" == "https://github.com/joshyorko/rcc/releases/download/$version/rcc-linux64" ]]
          [[ "$sha" =~ ^[0-9a-f]{64}$ ]]
          curl --fail --location --proto '=https' --tlsv1.2 "$url" -o "$RUNNER_TEMP/rcc-linux64"
          printf '%s  %s\n' "$sha" "$RUNNER_TEMP/rcc-linux64" | sha256sum --check --status
          chmod 0700 "$RUNNER_TEMP/rcc-linux64"
          echo "RCC_SHA256=$sha" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/rcc-linux64" version
      - name: Build, fresh-acquire, no-build verify, and execute controller artifact
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_controller_artifact.py \
            --manifest vscode-extension/runtime/controller-artifact-manifest.json \
            --rcc "$RUNNER_TEMP/rcc-linux64" \
            --platform linux-x64 \
            --rcc-sha256 "$RCC_SHA256" \
            --output-dir dist/controller-artifact \
            --repository "$GITHUB_WORKSPACE"
      - uses: actions/upload-artifact@v7
        with:
          name: josh-room-controller-linux-amd64
          path: dist/controller-artifact/

  windows-amd64:
    if: inputs.platform == 'win32-x64'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Download and verify the manifest-pinned RCC executable
        shell: pwsh
        run: |
          $manifest = Get-Content vscode-extension/runtime/controller-artifact-manifest.json | ConvertFrom-Json
          $version = $manifest.rcc.version
          $pin = $manifest.rcc.platforms.'win32-x64'
          $url = $pin.url
          $sha = $pin.sha256
          if ($version -notmatch '^v18\.19\.[0-9]+$') { throw 'The manifest has an unexpected RCC version.' }
          if ($url -ne "https://github.com/joshyorko/rcc/releases/download/$version/rcc-windows64.exe") { throw 'Windows RCC URL is not version-bound.' }
          if ($sha -notmatch '^[0-9a-f]{64}$') { throw 'The Windows RCC manifest checksum is invalid.' }
          $rcc = Join-Path $env:RUNNER_TEMP 'rcc-windows64.exe'
          Invoke-WebRequest -Uri $url -OutFile $rcc
          if ((Get-FileHash $rcc -Algorithm SHA256).Hash.ToLower() -ne $sha.ToLower()) { throw 'RCC SHA256 mismatch.' }
          "RCC_SHA256=$sha" >> $env:GITHUB_ENV
          & $rcc version
      - name: Build, fresh-acquire, no-build verify, and execute controller artifact
        shell: pwsh
        run: |
          python scripts/build_controller_artifact.py `
            --manifest vscode-extension/runtime/controller-artifact-manifest.json `
            --rcc (Join-Path $env:RUNNER_TEMP 'rcc-windows64.exe') `
            --platform win32-x64 `
            --rcc-sha256 $env:RCC_SHA256 `
            --output-dir dist/controller-artifact `
            --repository $env:GITHUB_WORKSPACE
      - uses: actions/upload-artifact@v7
        with:
          name: josh-room-controller-windows-amd64
          path: dist/controller-artifact/
