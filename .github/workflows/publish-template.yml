name: Validate Dev Container Template

on:
  push:
    branches: [main]
    paths:
      - "templates/room/**"
      - ".github/workflows/publish-template.yml"
  pull_request:
    branches: [main]
    paths:
      - "templates/room/**"
      - ".github/workflows/publish-template.yml"

concurrency:
  group: template-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  template:
    name: Validate room template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate template
        run: |
          jq -e '
            .id == "room" and
            (.version | test("^[0-9]+\\.[0-9]+\\.[0-9]+$")) and
            (.name | type == "string" and length > 0) and
            (.description | type == "string" and length > 0)
          ' templates/room/devcontainer-template.json
          jq empty templates/room/.devcontainer/devcontainer.json
          bash -n templates/room/.devcontainer/bootstrap.sh
