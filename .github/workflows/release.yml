name: Publish release artifacts

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Verify tag and package version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "joshyorko/josh-room"
          version=$(node -p "require('./vscode-extension/package.json').version")
          test "${GITHUB_REF_NAME}" = "v${version}-standalone-vsix"
          test "$(node -p "require('./templates/room/vscode-extension/package.json').version")" = "$version"
          test "$(jq -r .extension_version vscode-extension/runtime/manifest.json)" = "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Verify staged tested VSIX
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --json isDraft,targetCommitish,tagName | \
            jq -e --arg sha "$GITHUB_SHA" --arg tag "$GITHUB_REF_NAME" \
              '.isDraft == true and .targetCommitish == $sha and .tagName == $tag'
          mkdir -p dist
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --pattern "josh-room-${version}.vsix" --dir dist
          python scripts/verify_release_candidate.py \
            --candidate "dist/josh-room-${version}.vsix" --tag "$GITHUB_REF_NAME"
      - name: Build Python artifacts and checksums
        shell: bash
        run: |
          set -euo pipefail
          uv build
          (cd dist && sha256sum * > SHA256SUMS)
      - uses: actions/upload-artifact@v7
        with:
          name: josh-room-dist
          path: dist/
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          # Never upload over the tested VSIX. Only ancillary artifacts are new.
          gh release upload "$GITHUB_REF_NAME" dist/*.whl dist/*.tar.gz dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY"
          # Re-download immediately before publication to detect draft-asset drift.
          verify_dir=$(mktemp -d)
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --pattern "josh-room-${version}.vsix" --dir "$verify_dir"
          python scripts/verify_release_candidate.py \
            --candidate "$verify_dir/josh-room-${version}.vsix" --tag "$GITHUB_REF_NAME"
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --json isDraft,targetCommitish,tagName | \
            jq -e --arg sha "$GITHUB_SHA" --arg tag "$GITHUB_REF_NAME" \
              '.isDraft == true and .targetCommitish == $sha and .tagName == $tag'
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
